<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nageurs - DRP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <h1>Performances des nageurs DéRapéS</h1>

    <!-- Barre d'outils alignée en ligne -->
    <div class="toolbar">
        <select id="selectNageur" class="select-input">
            <option value="">-- Choisir un nageur --</option>
            {% for nageur in nageurs %}
            <option value="{{ nageur.licence }}">
                {{ nageur.nom_prenom }} ({{ nageur.categorie }})
            </option>
            {% endfor %}
        </select>

        <button id="btnScrape" class="btn-sync" onclick="lancerScraping()">
            🔄 Mettre à jour les nageurs via Extranat
        </button>

        <a id="grille_qualif" href="{{ url_for('grille_tps') }}" class="btn-sync">
            📊 Grilles de qualification
        </a>
    </div>

    <div id="statusMessage" class="status"></div>

    <!-- Section d'affichage des performances -->
    <div id="section-performances" style="display: none;" class="card-container">
        <h2 id="titre-nageur" class="nageur-title"></h2>
        
        <div class="table-responsive">
            <table id="table-performances" class="modern-table">
                <thead>
                    <tr>
                        <th>Nage</th>
                        <th>Records</th>
                        <th>Temps valides (3 saisons)</th>
                        <th id="en-tete-qualif-n2">Qualif N2</th>
                        <th>Qualif N1</th>
                    </tr>
                </thead>
                <tbody id="body-performances">
                </tbody>
            </table>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</body>

</html>
