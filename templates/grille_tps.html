<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultation des Temps de Qualification FFN</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/grille_tps.css') }}">
</head>

<body>

    <div class="card">
        <h2>Grilles de Qualification FFN</h2>

        <!-- Formulaire dynamique -->
        <form id="form-grille">
            <div class="form-group">
                <label for="annee">Saison :</label>
                <select id="annee" name="annee" required>
                    <option value="2027">2027</option>
                    <option value="2026">2026</option>
                    <option value="2025">2025</option>
                </select>
            </div>

            <div class="form-group">
                <label for="type_qualif">Compétition / Type :</label>
                <select id="type_qualif" name="type_qualif" required>
                    <option value="84">N1 - Bassin 50m</option>
                    <option value="85">N1 - Bassin 25m</option>
                    <option value="86">N2 - Bassin 50m</option>
                    <option value="87">N2 - Bassin 25m</option>
                </select>
            </div>

            <div class="form-group">
                <label for="genre">Sexe :</label>
                <select id="genre" name="genre" required>
                    <option value="1">Messieurs</option>
                    <option value="2">Dames</option>
                </select>
            </div>
            <button type="submit">Charger la grille</button>
        </form>

        <div id="loading">Chargement et vérification des données en cours...</div>
        <div id="resultats"></div>
    </div>
    <script src="{{ url_for('static', filename='js/grille_tps.js') }}" defer></script>
</body>

</html>
