<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grilles de Qualification FFN - DRP</title>
    <!-- Utilisation de la feuille de style commune style.css -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/grille_tps.css') }}">
</head>

<body>

    <h1>Grilles de Qualification FFN</h1>

    <!-- Barre d'outils alignée en ligne -->
    <form id="form-grille" class="toolbar">
        <select id="annee" name="annee" class="select-input" required>
            <option value="2027">Saison 2027</option>
            <option value="2026">Saison 2026</option>
            <option value="2025">Saison 2025</option>
        </select>

        <select id="type_qualif" name="type_qualif" class="select-input" required>
            <option value="84">N1 - Bassin 50m</option>
            <option value="85">N1 - Bassin 25m</option>
            <option value="86">N2 - Bassin 50m</option>
            <option value="87">N2 - Bassin 25m</option>
        </select>

        <select id="genre" name="genre" class="select-input" required>
            <option value="1">Messieurs</option>
            <option value="2">Dames</option>
        </select>

        <button type="submit" class="btn-sync">
            🔍 Charger la grille
        </button>

        <a href="{{ url_for('afficher_nageurs') }}" class="btn-sync">
            ⬅️ Retour aux nageurs
        </a>
    </form>

    <div id="loading" class="status" style="display: none;">Chargement et vérification des données en cours...</div>

    <!-- Conteneur de la grille chargée -->
    <div id="resultats" class="card-container" style="display: none;"></div>

    <script src="{{ url_for('static', filename='js/grille_tps.js') }}" defer></script>
</body>

</html>
